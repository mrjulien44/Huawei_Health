name: HACS validation and release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hacs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INTEGRATION_DOMAIN: huawei_health
  INTEGRATION_PATH: custom_components/huawei_health
  MANIFEST_PATH: custom_components/huawei_health/manifest.json
  RELEASE_FILENAME: huawei_health.zip

jobs:
  validate-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "LICENSE"
        